modLoader = "javafml"
loaderVersion = "[1,)"
license = "Apache-2.0"
issueTrackerURL = "https://github.com/traelmyx/wandering-collector-reborn/issues"

[[mods]]
modId = "${id}"
version = "${version}"
displayName = "${name}"
authors = "traelmyx, Siphalor"
${logo_key} = "assets/wandering_collector/icon.png"
displayTest = "IGNORE_SERVER_VERSION"
description = '''Items you lose come back: Wandering Traders offer to sell you stacks that despawned or burnt after you died. Based on Wandering Collector by Siphalor.'''

[[mixins]]
config = "wandering_collector.mixins.json"

[[dependencies.${id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neoforge_major},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${id}]]
modId = "minecraft"
type = "required"
versionRange = "${mc_dep}"
ordering = "NONE"
side = "BOTH"
